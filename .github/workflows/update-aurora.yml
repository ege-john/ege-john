name: Update contribution aurora

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'data/config.json'
      - 'data/motion.json'
      - 'data/style-template.svg'
      - '.github/workflows/update-aurora.yml'

permissions:
  contents: write

concurrency:
  group: contribution-aurora
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch calendars and rebuild SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AURORA_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_aurora.py
      - name: Commit changed artwork and snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/aurora.svg data/contributions.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update contribution aurora'
            git push
          fi
